name: Android

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew*'
      - '*.gradle.kts'
      - 'openapi/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew*'
      - '*.gradle.kts'
      - 'openapi/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      release_builds:
        description: Build optimized unsigned APK and AAB
        type: boolean
        default: false
      ui_tests:
        description: Run API 34 emulator UI tests
        type: boolean
        default: false
      visual_fixtures:
        description: Record and upload visual preview fixtures
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build and validate
        env:
          RELEASE_BUILDS: ${{ inputs.release_builds }}
          VISUAL_FIXTURES: ${{ inputs.visual_fixtures }}
        run: |
          tasks=(:app:assembleDebug :app:lintDebug)
          if [[ "$VISUAL_FIXTURES" == true ]]; then
            tasks+=(:app:recordRoborazziDebug)
          else
            tasks+=(:app:testDebugUnitTest)
          fi
          if [[ "$RELEASE_BUILDS" == true ]]; then
            tasks+=(:app:assembleRelease :app:bundleRelease)
          fi
          ./gradlew --no-daemon --console=plain "${tasks[@]}"
      - name: Package builds
        env:
          RELEASE_BUILDS: ${{ inputs.release_builds }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/sunshine-navigator-debug.apk
          if [[ "$RELEASE_BUILDS" == true ]]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk dist/sunshine-navigator-release-unsigned.apk
            cp app/build/outputs/bundle/release/app-release.aab dist/sunshine-navigator-release-unsigned.aab
          fi
          cd dist
          sha256sum sunshine-navigator-* > SHA256SUMS
      - name: Upload Android builds
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-builds-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Upload reports and requested preview fixtures
        if: always() && (failure() || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports-${{ github.sha }}
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/roborazzi/
          retention-days: 7

  ui:
    name: Emulator UI checks (opt-in)
    if: github.event_name == 'workflow_dispatch' && inputs.ui_tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: ./gradlew --no-daemon --console=plain :app:connectedDebugAndroidTest
      - name: Upload emulator test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-ui-reports-${{ github.sha }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 7
