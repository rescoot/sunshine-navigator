name: iOS simulator

on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate
          xcodebuild -version
      - name: Select an available iPhone simulator
        run: |
          xcrun simctl list devices available --json > /tmp/simulators.json
          python3 - <<'PY'
          import json, os
          devices = json.load(open('/tmp/simulators.json'))['devices']
          phones = [d for runtime, entries in devices.items() if 'iOS' in runtime for d in entries if d['name'].startswith('iPhone') and d['isAvailable']]
          if not phones:
              raise SystemExit('No iPhone simulator runtime installed')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('SIMULATOR_ID=' + phones[0]['udid'] + '\n')
          PY
      - name: Build app and share extension, then run tests
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test -project SunshineNavigator.xcodeproj -scheme Navigator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath DerivedData -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM='' \
            | tee build.log
      - name: Package simulator app
        working-directory: ios
        run: |
          mkdir -p build
          ditto -c -k --sequesterRsrc --keepParent DerivedData/Build/Products/Debug-iphonesimulator/Navigator.app build/Navigator-simulator.zip
          cd build
          shasum -a 256 Navigator-simulator.zip > SHA256SUMS
      - name: Upload simulator build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-simulator-${{ github.sha }}
          path: ios/build/
          if-no-files-found: error
          retention-days: 30
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-test-results-${{ github.sha }}
          path: |
            ios/build.log
            ios/TestResults.xcresult/
          retention-days: 14
