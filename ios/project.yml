name: SunshineNavigator
options:
  bundleIdPrefix: org.rescoot
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '2.1.6'
    CURRENT_PROJECT_VERSION: '17'
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
targets:
  Navigator:
    type: application
    platform: iOS
    sources:
      - Sources/App
      - Sources/Core
      - Sources/SharedUI
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.rescoot.sunshine-navigator
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Navigator
    info:
      path: Generated/App-Info.plist
      properties:
        CFBundleDisplayName: Navigator
        LSRequiresIPhoneOS: true
        CFBundleURLTypes:
          - CFBundleURLName: Sunshine OAuth
            CFBundleURLSchemes: [dev.ligustah.lsnav]
        NavigatorKeychainGroup: $(AppIdentifierPrefix)org.rescoot.sunshine-navigator
        UIAppFonts: [plate.ttf]
        UILaunchScreen:
          UIImageName: sunshine_logo
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Generated/Navigator.entitlements
      properties:
        com.apple.security.application-groups: [group.org.rescoot.sunshine-navigator]
        keychain-access-groups: [$(AppIdentifierPrefix)org.rescoot.sunshine-navigator]
    dependencies:
      - target: SendToScooter
  SendToScooter:
    type: app-extension
    platform: iOS
    sources:
      - Sources/Share
      - Sources/Core
      - Sources/SharedUI
      - path: Resources
        excludes: [Assets.xcassets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.rescoot.sunshine-navigator.share
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Generated/Share-Info.plist
      properties:
        CFBundleDisplayName: Send to scooter
        NavigatorKeychainGroup: $(AppIdentifierPrefix)org.rescoot.sunshine-navigator
        UIAppFonts: [plate.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    entitlements:
      path: Generated/Share.entitlements
      properties:
        com.apple.security.application-groups: [group.org.rescoot.sunshine-navigator]
        keychain-access-groups: [$(AppIdentifierPrefix)org.rescoot.sunshine-navigator]
  NavigatorTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.rescoot.sunshine-navigator.tests
    dependencies:
      - target: Navigator
  NavigatorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.rescoot.sunshine-navigator.uitests
        TEST_TARGET_NAME: Navigator
    dependencies:
      - target: Navigator
schemes:
  Navigator:
    build:
      targets:
        Navigator: all
        SendToScooter: all
    test:
      gatherCoverageData: true
      targets:
        - NavigatorTests
        - NavigatorUITests
